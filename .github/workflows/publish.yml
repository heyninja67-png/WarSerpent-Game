name: Publish Android release
on:
  push:
    branches: [downloads]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check artifact hashes
        run: sha256sum -c SHA256SUMS
      - name: Create release and upload files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo 'Release already exists; preserving existing contents.'
            exit 1
          fi
          gh release create v1.1.0 WarSerpentIO-v1.1.0.apk WarSerpentIO-Source-v1.1.0.zip SHA256SUMS --target main --title "War Serpent.io 1.1.0 — performance, audio and multiplayer" --notes-file README.md
